[EMC]
VERSION = 1.1
MACHINE = SGCAM_PB_ATC
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic
OPEN_FILE = ~/linuxcnc/nc_files/probe_basic/examples/blank.ngc
CONFIG_FILE = custom_config.yml
CYCLE_TIME = 0.200
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 300
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 3
EDITOR = gedit
INCREMENTS = JOG 0.1 0.01 0.001
GEOMETRY = XYZ
DRO_DISPLAY = XYZ
ATC_TAB_DISPLAY = 2
USER_BUTTONS_PATH = user_buttons/
USER_ATC_BUTTONS_PATH = user_atc_buttons/
USER_DROS_PATH = user_dro_display/
OFFSET_COLUMNS = X Y Z    # <--- 就是新增這一行！告訴 UI 表格只要畫出這三軸

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
png = image-to-gcode

[PYTHON]
TOPLEVEL = ./python/toplevel.py
PATH_APPEND = ./python/

[ATC]
POCKETS = 12

[RS274NGC]
RS274NGC_STARTUP_CODE = F10 S300 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = vmc_metric.var
SUBROUTINE_PATH = macros_metric_sim
REMAP=M6  modalgroup=6 prolog=change_prolog ngc=toolchange epilog=change_epilog
REMAP=M10 modalgroup=6 argspec=P ngc=m10
REMAP=M11 modalgroup=6 argspec=p ngc=m11
REMAP=M12 modalgroup=6 argspec=p ngc=m12
REMAP=M13 modalgroup=6 ngc=m13
REMAP=M21 modalgroup=6 ngc=m21
REMAP=M22 modalgroup=6 ngc=m22
REMAP=M23 modalgroup=6 ngc=m23
REMAP=M24 modalgroup=6 ngc=m24
REMAP=M25 modalgroup=6 ngc=m25
REMAP=M26 modalgroup=6 ngc=m26

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = 3axis.hal
POSTGUI_HALFILE = probe_basic_postgui.hal

[TRAJ]
AXES = 3
SPINDLES = 1
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 125

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool_metric.tbl
RANDOM_TOOLCHANGER = 0

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[SPINDLE]
PGAIN_V = 0
IGAIN_V = 0.01
DGAIN_V = 0
FF0_V = 1
FF1_V = 0
PGAIN_P = 100
IGAIN_P = 1
DGAIN_P = 0
FF0_P = 0
FF1_P = 1

# --- Axis X ---
[AXIS_X]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
STEP_SCALE = 1000.0
FERROR = 50.0
MIN_FERROR = 5.0
P_GAIN = 1000
I_GAIN = 0
D_GAIN = 0
FF0 = 0
FF1 = 1.0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 2

# --- Axis Y ---
[AXIS_Y]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
STEP_SCALE = 1000.0
FERROR = 50.0
MIN_FERROR = 5.0
P_GAIN = 1000
I_GAIN = 0
D_GAIN = 0
FF0 = 0
FF1 = 1.0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 2

# --- Axis Z ---
[AXIS_Z]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
STEP_SCALE = 2000.0
FERROR = 50.0
MIN_FERROR = 5.0
P_GAIN = 1000
I_GAIN = 0
D_GAIN = 0
FF0 = 0
FF1 = 1.0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

